syntax = "proto3";

package echopb;

option go_package = "github.com/wangtengda0310/gobee/pcap/examples/buf/proto/go/echopb";

// EchoRequest 客户端发送的回显请求。
message EchoRequest {
  // message 需要回显的文本内容。
  string message = 1;
  // seq 客户端序列号，服务端原样返回，用于请求-响应配对。
  uint32 seq = 2;
}

// EchoResponse 服务端返回的回显响应。
message EchoResponse {
  // message 原样回显的文本。
  string message = 1;
  // seq 原样返回的序列号。
  uint32 seq = 2;
  // server_time 服务端时间戳（Unix 毫秒），用于演示服务端→客户端的数据。
  int64 server_time = 3;
}

// SumRequest 批量求和请求（演示包含 repeated 字段的消息）。
message SumRequest {
  repeated int32 numbers = 1;
}

// SumResponse 求和结果。
message SumResponse {
  int32 sum = 1;
  int32 count = 2;
}
