version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # 获取 git 信息（用于生产构建时注入版本）
  GIT_COMMIT_HASH:
    sh: git log -1 --pretty=format:%h 2>/dev/null || echo "dev"
  GIT_COMMIT_MESSAGE:
    sh: git log -1 --pretty=format:%s 2>/dev/null || echo "development"
  GIT_COMMIT_AUTHOR:
    sh: git log -1 --pretty=format:%an 2>/dev/null || echo "unknown"
  GIT_COMMIT_DATE:
    sh: git log -1 --pretty=format:%cr 2>/dev/null || echo ""
  # 使用 git 获取时间，跨平台兼容
  BUILD_TIME:
    sh: git show -s --format=%ci HEAD 2>/dev/null || echo "unknown"

tasks:
  build:
    summary: Builds the application for Windows
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          PRODUCTION:
            ref: .PRODUCTION
      - task: common:generate:icons
    cmds:
      - task: generate:syso
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}.exe
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      # 生产构建时通过 -ldflags 注入版本信息
      LDFLAGS: >-
        {{if eq .PRODUCTION "true"}}
        -w -s -H windowsgui
        -X "rain-qa-func/internal.VersionCommitHash={{.GIT_COMMIT_HASH}}"
        -X "rain-qa-func/internal.VersionCommitMessage={{.GIT_COMMIT_MESSAGE}}"
        -X "rain-qa-func/internal.VersionCommitAuthor={{.GIT_COMMIT_AUTHOR}}"
        -X "rain-qa-func/internal.VersionCommitDate={{.GIT_COMMIT_DATE}}"
        -X "rain-qa-func/internal.VersionBuildTime={{.BUILD_TIME}}"
        {{else}}
        {{end}}
      # PRODUCTION=false（默认 wails3 task build）也加 -H windowsgui（GUI subsystem），
      # 否则双击 .exe 会开 cmd 窗口（console subsystem）。
      # 注：subsystem（决定是否开 cmd 窗口）与 cobra Mousetrap（决定是否阻塞 runWails）是两个独立机制：
      # - subsystem 在此 -H windowsgui 控制（GUI subsystem 双击无 cmd）
      # - Mousetrap 在 cmd/rain-qa-func/root.go init 设 cobra.MousetrapHelpText="" 禁用
      # 两者必须分别处理，单改 subsystem 不能让双击启动 GUI（Mousetrap 仍阻塞）。
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="{{.LDFLAGS}}"{{else}}-buildvcs=false -gcflags=all="-l" -ldflags="-H windowsgui"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: 0
      GOARCH: '{{.ARCH | default ARCH}}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Packages a production build of the application
    cmds:
      - |-
        if [ "{{.FORMAT | default "nsis"}}" = "msix" ]; then
          task: create:msix:package
        else
          task: create:nsis:installer
        fi
    vars:
      FORMAT: '{{.FORMAT | default "nsis"}}'

  generate:syso:
    summary: Generates Windows `.syso` file
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  create:nsis:installer:
    summary: Creates an NSIS installer
    dir: build/windows/nsis
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      # Create the Microsoft WebView2 bootstrapper if it doesn't exist
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - makensis -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" project.nsi
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}'

  create:msix:package:
    summary: Creates an MSIX package
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - |-
        wails3 tool msix \
          --config "{{.ROOT_DIR}}/wails.json" \
          --name "{{.APP_NAME}}" \
          --executable "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" \
          --arch "{{.ARCH}}" \
          --out "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH}}.msix" \
          {{if .CERT_PATH}}--cert "{{.CERT_PATH}}"{{end}} \
          {{if .PUBLISHER}}--publisher "{{.PUBLISHER}}"{{end}} \
          {{if .USE_MSIX_TOOL}}--use-msix-tool{{else}}--use-makeappx{{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      CERT_PATH: '{{.CERT_PATH | default ""}}'
      PUBLISHER: '{{.PUBLISHER | default ""}}'
      USE_MSIX_TOOL: '{{.USE_MSIX_TOOL | default "false"}}'

  install:msix:tools:
    summary: Installs tools required for MSIX packaging
    cmds:
      - wails3 tool msix-install-tools

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
