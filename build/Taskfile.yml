version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    dir: frontend
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/*
    preconditions:
      - sh: pnpm -v
        msg: "Looks like pnpm isn't installed. Install via: npm install -g pnpm"
    cmds:
      - pnpm install

  build:frontend:
    label: build:frontend (PRODUCTION={{.PRODUCTION}})
    summary: Build the frontend project
    dir: frontend
    sources:
      - "src/**/*"
      - "index.html"
      - "vite.config.*"
      - "tsconfig.json"
      - "package.json"
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - pnpm run {{.BUILD_COMMAND}}
    env:
      PRODUCTION: '{{.PRODUCTION | default "false"}}'
    vars:
      BUILD_COMMAND: '{{if eq .PRODUCTION "true"}}build{{else}}build:dev{{end}}'


  generate:bindings:
    label: generate:bindings (BUILD_FLAGS={{.BUILD_FLAGS}})
    summary: Generates bindings for the frontend
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - frontend/bindings/**/*  # Rerun when switching between dev/production mode causes changes in output
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true -ts

  generate:icons:
    summary: Generates Windows `.ico` file from an image
    dir: build
    sources:
      - "appicon.png"
    generates:
      - "windows/icon.ico"
    cmds:
      - wails3 generate icons -input appicon.png -windowsfilename windows/icon.ico

  dev:frontend:
    summary: Runs the frontend in development mode
    dir: frontend
    deps:
      - task: install:frontend:deps
    cmds:
      - pnpm run dev --port {{.VITE_PORT}} --strictPort

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .

  build:all:
    summary: 构建 rain-qa-func.exe 和 rain-excel-checker（Linux 二进制用于 Docker）
    cmds:
      - task: build
      - task: build:rain-excel-checker

  build:rain-excel-checker:
    summary: 构建 rain-excel-checker Linux 静态二进制用于 Docker
    dir: ..
    sources:
      - cmd/rain-excel-checker/**/*.go
      - backend/pkg/rain-excel-checker/**/*.go
      - go.mod
      - go.sum
    generates:
      - docker/rain-excel-checker
    cmds:
      # 源码入口为 cmd/rain-excel-checker/main.go，库代码在 backend/pkg/rain-excel-checker/
      # 项目根的旧 rain-excel-checker/ 目录已于 e11645d 重构删除，切勿回退为此路径
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o docker/rain-excel-checker -ldflags="-w -s" ./cmd/rain-excel-checker/
